const pad2 = n => String(n).padStart(2,'0');
const fmtDate = d => d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
const todayStr = () => fmtDate(new Date());
function dateLabel(dateStr){
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  const w = ['日','一','二','三','四','五','六'][dt.getDay()];
  let prefix = '';
  if(dateStr === todayStr()) prefix = '今天 · ';
  else {
    const yest = new Date(); yest.setDate(yest.getDate()-1);
    if(dateStr === fmtDate(yest)) prefix = '昨天 · ';
  }
  return `${prefix}${y}年${m}月${d}日 星期${w}`;
}
function fmtMs(ms){
  const s = Math.max(0, Math.ceil(Math.abs(ms)/1000));
  return Math.floor(s/60)+':'+pad2(s%60);
}
const clamp = (v,a,b) => Math.min(b, Math.max(a, v));

function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escapeAttr(s){ return String(s).replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function getPinyin(char){

function parseChars(str){
  const out = [];
  const norm = String(str||'').replace(/[^\u4e00-\u9fa5]/g, ' ').trim();
  norm.split(/\s+/).filter(Boolean).forEach(seg => { for(const c of seg) if(/[\u4e00-\u9fa5]/.test(c)) out.push(c); });
  return out;
}
function parseWords(str){
  return String(str||'').split(/\s+/).map(s => s.trim()).filter(Boolean).map(s => s.replace(/[^\u4e00-\u9fa5]/g,'')).filter(Boolean).slice(0, 40);
}

function calcLiveLeftMs(l){
  if(!l) return 0;
  if(l.mode === 'running') return Math.max(0, l.totalMs - (Date.now() - l.startAt));
  if(l.mode === 'paused' || l.mode === 'idle') return Math.max(0, Number(l.leftMs) || 0);
  if(l.mode === 'chomping') return 0;
  return 0;
}

function pushLive(immediate){
  if(!liveRef || !fbSet) return;
  live.updatedAt = Date.now();
  const snap = { ...live };
  const doPush = () => {
    liveUploadTimer = null;
    try{ fbSet(liveRef, snap).catch(e => console.warn('pushLive failed', e)); }catch(e){}
  };
  if(immediate){
    clearTimeout(liveUploadTimer);
    doPush();
  } else if(!liveUploadTimer){
    liveUploadTimer = setTimeout(doPush, 250);
  }
}

function applyLive(remote){
  if(!remote) return;
  if(remote.owner === myClientId) return;
  const rAt = Number(remote.updatedAt) || 0;
  if(rAt <= lastAppliedLiveAt) return;
  lastAppliedLiveAt = rAt;

  live.taskId       = remote.taskId || null;
  live.mode         = remote.mode || 'idle';
  live.totalMs      = Number(remote.totalMs) || 0;
  live.startAt      = Number(remote.startAt) || 0;
  live.leftMs       = Number(remote.leftMs) || 0;
  live.rounds       = Number(remote.rounds) || 0;
  live.chompingEndAt= Number(remote.chompingEndAt) || 0;
  live.owner        = remote.owner || '';
  live.updatedAt    = rAt;

  if(live.taskId){
    const info = findTask(live.taskId);
    if(!info){ live.taskId = null; live.mode = 'idle'; }
    else {
      try{ initCharTimer(live.taskId); }catch(e){}
      if(live.mode === 'paused') setCharPaused(true);
      else if(live.mode === 'running') setCharPaused(false);
    }
  } else {
    try{ clearCharTimer(); }catch(e){}
  }
  dogEl.classList.remove('running','paused','chomp');
  if(live.mode === 'running') dogEl.classList.add('running');
  else if(live.mode === 'paused') dogEl.classList.add('paused');
  else if(live.mode === 'chomping') dogEl.classList.add('chomp');

  refreshAllCards(); updateDogBar(); updateMainBtn();
  if(live.mode === 'running' || live.mode === 'chomping') ensureTickRunning();
}

function normalizeSettings(raw){
  const d = DEFAULT_SETTINGS;
  const r = (raw && typeof raw === 'object') ? raw : {};
  const unit = (r.unit && typeof r.unit === 'object') ? r.unit : {};
  const pick = (t) => {
    const u = (unit[t] && typeof unit[t] === 'object') ? unit[t] : {};
    const m = Number(u.min), s = Number(u.sun);
    return {
      min: clamp(isFinite(m) && m > 0 ? m : d.unit[t].min, 0.5, 20),
      sun: clamp(isFinite(s) && s > 0 ? s : d.unit[t].sun, 0.5, 50)
    };
  };
  const li = (r.lastInputs && typeof r.lastInputs === 'object') ? r.lastInputs : {};
  const pc = (r.panelCollapsed && typeof r.panelCollapsed === 'object') ? r.panelCollapsed : {};
  const ec = (r.eyeCare && typeof r.eyeCare === 'object') ? r.eyeCare : {};
  const num = (v, dv, min, max) => { const n = Number(v); return clamp(isFinite(n) ? n : dv, min, max); };
  return {
    unit: { preview: pick('preview'), wordgroup: pick('wordgroup'), copy: pick('copy') },
    eyeCare: { useMin: num(ec.useMin, d.eyeCare.useMin, 1, 120), restMin: num(ec.restMin, d.eyeCare.restMin, 1, 60) },
    lastInputs: {
      chineseMin: num(li.chineseMin, d.lastInputs.chineseMin, 1, 120),
      chineseSun: num(li.chineseSun, d.lastInputs.chineseSun, 1, 500),
      mathMin: num(li.mathMin, d.lastInputs.mathMin, 1, 120),
      mathSun: num(li.mathSun, d.lastInputs.mathSun, 1, 500),
      englishMin: num(li.englishMin, d.lastInputs.englishMin, 1, 120),
      englishSun: num(li.englishSun, d.lastInputs.englishSun, 1, 500),
      sunAmount: num(li.sunAmount, d.lastInputs.sunAmount, 1, 9999)
    },
    panelCollapsed: {
      progress: pc.progress !== undefined ? !!pc.progress : true,
      sun: pc.sun !== undefined ? !!pc.sun : true,
      date: pc.date !== undefined ? !!pc.date : true,
      library: pc.library !== undefined ? !!pc.library : true,
      sync: pc.sync !== undefined ? !!pc.sync : true,
      password: pc.password !== undefined ? !!pc.password : true,
      eye: pc.eye !== undefined ? !!pc.eye : true,
      math: pc.math !== undefined ? !!pc.math : false,
      english: pc.english !== undefined ? !!pc.english : false
    }
  };
}
function getUnitCfg(type){
  const st = state.settings || DEFAULT_SETTINGS;
  const u = (st.unit && st.unit[type]) || DEFAULT_SETTINGS.unit[type];
  return { min: clamp(Number(u.min) || DEFAULT_SETTINGS.unit[type].min, 0.5, 20), sun: clamp(Number(u.sun) || DEFAULT_SETTINGS.unit[type].sun, 0.5, 50) };
}
function getEyeCfg(){
  const st = state.settings || DEFAULT_SETTINGS;
  const ec = (st.eyeCare && typeof st.eyeCare === 'object') ? st.eyeCare : DEFAULT_SETTINGS.eyeCare;
  return { useMin: clamp(Number(ec.useMin) || DEFAULT_SETTINGS.eyeCare.useMin, 1, 120), restMin: clamp(Number(ec.restMin) || DEFAULT_SETTINGS.eyeCare.restMin, 1, 60) };
}
function normalizeLessonLibrary(raw){
  const out = {};
  if(!raw || typeof raw !== 'object') return out;
  Object.keys(raw).forEach(k => {
    const v = raw[k];
    if(!v || typeof v !== 'object') return;
    const name = String(k).slice(0,60).trim();
    if(!name) return;
    out[name] = {
      chars: String(v.chars || '').slice(0,600),
      wordgroups: String(v.wordgroups || v.wordgroup || v.groups || '').slice(0,600),
      words: String(v.words || '').slice(0,600)
    };
  });
  return out;
}
function makeTask(text, minutes, sun, extra){
  const task = {
    id: newId(),
    type: (extra && extra.type) || 'custom',
    text: String(text).slice(0,500),
    done: false,
    minutes: clamp(Number(minutes)||10, 0.5, 120),
    sun: clamp(Math.round(Number(sun)||30), 1, 500)
  };
  if(extra && extra.chars) task.chars = extra.chars.slice(0,60);
  if(extra && extra.words) task.words = extra.words.slice(0,60);
  return task;
}
let nameMigrated = false;
function fixTaskName(text){
  let t = String(text == null ? '' : text);
  if(t.indexOf('会写字（') === 0){ t = '预习生字（' + t.slice(4); nameMigrated = true; }
  else if(t.indexOf('会识字（') === 0){ t = '抄写并组词（' + t.slice(4); nameMigrated = true; }
  else if(t.indexOf('生字组词（') === 0){ t = '抄写词语（' + t.slice(5); nameMigrated = true; }
  return t;
}
function makeDay(){ return { chinese: [], math: [], english: [] }; }
function normalizeDay(day){
  const out = makeDay();
  ['chinese','math','english'].forEach(k => {
    if(!Array.isArray(day[k])) return;
    out[k] = day[k].map(t => {
      const type = t.type || 'custom';
      const item = {
        id: t.id || newId(), type,
        text: fixTaskName(String(t.text || '作业')).slice(0,500),
        done: !!t.done,
        minutes: clamp(Number(t.minutes)||10, 0.5, 120),
        sun: clamp(Math.round(Number(t.sun)||30), 1, 500)
      };
      if(type === 'preview' && Array.isArray(t.chars)) item.chars = t.chars.slice(0,60);
      if((type === 'wordgroup' || type === 'copy') && Array.isArray(t.words)) item.words = t.words.slice(0,60);
      return item;
    });
  });
  return out;
}

function attachSubjectsProxy(s){
  Object.defineProperty(s, 'subjects', {
    get(){ if(!s.days[s.date]) s.days[s.date] = makeDay(); return s.days[s.date]; },
    configurable: true, enumerable: false
  });

  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}

function pruneDays(){
  const keys = Object.keys(state.days).sort();
  if(keys.length > MAX_DAYS_KEPT) keys.slice(0, keys.length - MAX_DAYS_KEPT).forEach(k => delete state.days[k]);

function findTask(id){
  for(const k of Object.keys(SUBJECTS)){
    const t = state.subjects[k].find(x => x.id === id);

}

/* ============================================================
   ☁️ 云端同步
============================================================ */
let lastPushedUpdatedAt = 0;
let lastRemoteUpdatedAt = 0;
let uploadFailedNotified = false;

async function uploadToCloud(force){
  if(!dataRef || !fbSet || !fbGet) return false;
  if(isRemoteUpdate && !force) return false;
  if(freshBoot && !force && !lastRemoteUpdatedAt){ console.warn('跳过上传：本机无历史存档'); return false; }
  const payload = {
    days: state.days, date: state.date, settings: state.settings, sun: state.sun,
    checkins: state.checkins, sunLog: Array.isArray(state.sunLog) ? state.sunLog : [],
    lessonLibrary: state.lessonLibrary, parentPassword: state.parentPassword,
    updatedAt: Date.now()
  };
  const prevPushed = lastPushedUpdatedAt;
  lastPushedUpdatedAt = payload.updatedAt;
  updateSyncInfo();
  try{
    await fbSet(dataRef, payload);
    try{
      const snap = await fbGet(dataRef);
      const vAt = snap.exists() ? Number(snap.val().updatedAt) : 0;
      if(vAt !== payload.updatedAt){ lastPushedUpdatedAt = prevPushed; showSyncStatus('⚠️ 云端写入未生效', 'offline'); return false; }
    }catch(e){}
    uploadFailedNotified = false;
    return true;
  }catch(e){
    console.warn('云端上传失败', e);
    lastPushedUpdatedAt = prevPushed;
    if(!uploadFailedNotified){ uploadFailedNotified = true; showSyncStatus('⚠️ 云端上传失败', 'offline'); }
    return false;
  }
}
function applyRemoteState(remote){
  if(!remote || !remote.days) return;
  const rAt = Number(remote.updatedAt) || 0;
  if(rAt && rAt === lastPushedUpdatedAt) return;
  if(rAt && rAt < lastRemoteUpdatedAt) return;
  isRemoteUpdate = true;
  try{ localStorage.setItem(STORAGE_KEY + '_before_remote', JSON.stringify(state)); }catch(e){}
  const newDays = {};
  Object.keys(remote.days).forEach(k => { newDays[k] = normalizeDay(remote.days[k]); });
  state.days = newDays;
  if(!state.days[state.date]) state.days[state.date] = makeDay();
  if(remote.settings) state.settings = normalizeSettings(remote.settings);
  if(typeof remote.sun === 'number') state.sun = remote.sun;
  if(Array.isArray(remote.checkins)) state.checkins = remote.checkins;
  if(Array.isArray(remote.sunLog)) state.sunLog = remote.sunLog.slice(0, 60);
  if(remote.lessonLibrary) state.lessonLibrary = normalizeLessonLibrary(remote.lessonLibrary);
  if(typeof remote.parentPassword === 'string' && /^\d{4}$/.test(remote.parentPassword)) state.parentPassword = remote.parentPassword;
  if(rAt) lastRemoteUpdatedAt = rAt;
  saveLocalState();
  renderStats(); renderBoard(); refreshAllCards();
  updateDogBar(); updateMainBtn(); updateDateText();
  if(isAdminMode) renderAdminPanel();
  isRemoteUpdate = false;
  showSyncStatus('☁️ 已从云端更新', 'online');
  updateSyncInfo();
}
let cloudListener = null;
let liveListener = null;
function startCloudSync(){
  if(dataRef && fbOnValue && !cloudListener){
    cloudListener = fbOnValue(dataRef, snapshot => {
      const remote = snapshot.val();
      if(!remote) return;
      applyRemoteState(remote);
    }, err => { console.warn('云端监听失败', err); showSyncStatus('⚠️ 云端连接失败', 'offline'); });
  }
  if(liveRef && fbOnValue && !liveListener){
    liveListener = fbOnValue(liveRef, snapshot => {
      const remote = snapshot.val();
      if(!remote) return;
      applyLive(remote);

/* ============================================================
   音效
============================================================ */
let audioCtx = null;
function ensureAudio(){
  if(!audioCtx){ try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ audioCtx=null; } }
  if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function tone(freq,start,dur,type,vol){
  if(!audioCtx) return;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = type||'sine'; o.frequency.setValueAtTime(freq,start);
  g.gain.setValueAtTime(0.0001,start);
  g.gain.linearRampToValueAtTime(vol||0.12,start+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,start+dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(start); o.stop(start+dur+0.02);
}
function playSound(kind){
  if(!ensureAudio()) return;
  const now = audioCtx.currentTime;
  if(kind==='hit'){
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type='square'; o.frequency.setValueAtTime(340,now);
    o.frequency.exponentialRampToValueAtTime(70,now+0.18);
    g.gain.setValueAtTime(0.10,now); g.gain.exponentialRampToValueAtTime(0.0001,now+0.2);
    o.connect(g);g.connect(audioCtx.destination); o.start(now);o.stop(now+0.22);
  }
  else if(kind==='plant'){ [523.25,659.25,783.99].forEach((f,i)=>tone(f,now+i*0.075,0.22,'triangle',0.10)); }
  else if(kind==='start'){ [660,880].forEach((f,i)=>tone(f,now+i*0.08,0.18,'triangle',0.09)); }
  else if(kind==='pause'){ [520,400].forEach((f,i)=>tone(f,now+i*0.10,0.20,'sine',0.09)); }
  else if(kind==='chomp'){ tone(320,now,0.07,'square',0.16); tone(180,now+0.06,0.09,'square',0.18); tone(90,now+0.13,0.16,'sawtooth',0.16); tone(60,now+0.15,0.20,'sine',0.10); }
  else if(kind==='fail'){ tone(300,now,0.16,'sine',0.08);tone(200,now+0.16,0.26,'sine',0.08); }
  else if(kind==='win'){ [523.25,659.25,783.99,1046.5,1318.5].forEach((f,i)=>tone(f,now+i*0.11,0.4,'triangle',0.12));tone(1568,now+0.6,0.8,'sine',0.08); }
}
function playEyeAlert(){
  if(!ensureAudio()) return;
  const now = audioCtx.currentTime;
  for(let i = 0; i < 3; i++){ tone(880, now + i*0.22, 0.16, 'sine', 0.16); tone(1174.7, now + i*0.22 + 0.02, 0.14, 'triangle', 0.08); }
}
function playRestDone(){
  if(!ensureAudio()) return;
  const now = audioCtx.currentTime;
  [659.25, 880, 1046.5].forEach((f,i) => tone(f, now + i*0.11, 0.22, 'triangle', 0.12));
}

function charBarEnsure(mizi){
  let bar = mizi.querySelector('.mizi-bar');
  if(!bar){ bar = document.createElement('div'); bar.className = 'mizi-bar'; mizi.appendChild(bar); }
  return bar;
}
function clearCharTimer(){ charTimer.active=false; charTimer.taskId=null; charTimer.units=[]; charTimer.index=0; }
function attachCharBars(units, reset){
  units.forEach(u => {
    u.bars = u.mizis.map(m => {
      const bar = charBarEnsure(m);
      if(reset){ bar.style.width = '0%'; bar.__w = '0%'; }
      bar.classList.remove('paused');
      return bar;
    });
  });
}
function buildCharUnits(task, grid){
  const units = [];
  let mode = 'per-char';
  if(task.type === 'preview'){
    const cfg = getUnitCfg('preview');
    const ms = Math.max(20000, cfg.min * 60000);
    grid.querySelectorAll('.char-card').forEach(card => {
      const mizi = card.querySelector('.mizi');
      if(mizi) units.push({ mizis:[mizi], bars:[], totalMs:ms, leftMs:ms });
    });
  } else if(task.type === 'wordgroup' || task.type === 'copy'){
    mode = 'per-word';
    const cfg = getUnitCfg(task.type);
    grid.querySelectorAll('.word-group').forEach(g => {
      const mizis = Array.from(g.querySelectorAll('.mizi'));
      if(!mizis.length) return;
      const factor = (task.type === 'wordgroup') ? mizis.length : 1;
      const ms = Math.max(20000, factor * cfg.min * 60000);
      units.push({ mizis, bars:[], totalMs:ms, leftMs:ms });
    });
  }
  return { units, mode };
}
function initCharTimer(taskId){
  clearCharTimer();
  const info = findTask(taskId);
  if(!info) return;
  const ref = cardRefs[taskId];
  if(!ref || !ref.el) return;
  const grid = ref.el.querySelector('.char-grid');
  if(!grid) return;
  const built = buildCharUnits(info.task, grid);
  if(!built.units.length) return;
  attachCharBars(built.units, true);
  charTimer.active = true;
  charTimer.taskId = taskId;
  charTimer.mode = built.mode;
  charTimer.units = built.units;
  charTimer.index = 0;
  paintCharBars();
}
function rebindCharTimer(){
  if(!charTimer.active || !charTimer.taskId) return;
  const ref = cardRefs[charTimer.taskId];
  if(!ref || !ref.el){ clearCharTimer(); return; }
  const grid = ref.el.querySelector('.char-grid');
  if(!grid){ clearCharTimer(); return; }
  const groups = [];
  if(charTimer.mode === 'per-char'){
    grid.querySelectorAll('.char-card').forEach(c => { const m = c.querySelector('.mizi'); if(m) groups.push([m]); });
  } else {
    grid.querySelectorAll('.word-group').forEach(g => { const ms = Array.from(g.querySelectorAll('.mizi')); if(ms.length) groups.push(ms); });
  }
  if(groups.length !== charTimer.units.length){ clearCharTimer(); return; }
  charTimer.units.forEach((u, i) => { u.mizis = groups[i]; });
  attachCharBars(charTimer.units, false);
  paintCharBars();
}
function paintCharBars(){
  if(!charTimer.active) return;
  charTimer.units.forEach((u, i) => {
    let w;
    if(i < charTimer.index) w = '100%';
    else if(i === charTimer.index) w = (clamp(1 - u.leftMs/u.totalMs, 0, 1) * 100) + '%';
    else w = '0%';
    u.bars.forEach(b => { if(b.__w !== w){ b.__w = w; b.style.width = w; } });
  });
}
function tickChar(dt){
  if(!charTimer.active) return;
  const u = charTimer.units[charTimer.index];
  if(!u) return;
  u.leftMs -= dt;
  if(u.leftMs <= 0){
    charTimer.index++;
    if(charTimer.index >= charTimer.units.length){
      charTimer.index = 0;
      charTimer.units.forEach(x => { x.leftMs = x.totalMs; });
    }
  }
  paintCharBars();
}
function resetCharProgress(){
  if(!charTimer.active) return;
  charTimer.index = 0;
  charTimer.units.forEach(u => { u.leftMs = u.totalMs; });
  paintCharBars();
}
function setCharPaused(p){
  if(!charTimer.active) return;
  charTimer.units.forEach(u => u.bars.forEach(b => b.classList.toggle('paused', p)));
}

  updateEyeUI();
}
function startEyeRest(){
  if(!eyeTimer.active) return;
  if(eyeTimer.mode !== 'use' && eyeTimer.mode !== 'need-rest') return;
  const cfg = getEyeCfg();
  eyeTimer.mode = 'rest';
  eyeTimer.totalMs = cfg.restMin * 60000;
  eyeTimer.leftMs = eyeTimer.totalMs;
  eyeTimer.overdueMs = 0;
  eyeTimer.nagAccumMs = 0;
  measureEyeRail(); updateEyeUI();
  toast('😌 放松眼睛计时开始（' + cfg.restMin + ' 分钟）', 2200);
}
function tickEye(dt){
  if(!eyeTimer.active) return;
  if(eyeTimer.mode === 'use'){
    eyeTimer.leftMs -= dt;
    if(eyeTimer.leftMs <= 0){
      eyeTimer.leftMs = 0;
      eyeTimer.mode = 'need-rest';
      eyeTimer.overdueMs = 0;
      eyeTimer.nagAccumMs = 0;
      playEyeAlert();
      toast('⏰ 该放松眼睛啦！点「放松眼睛」休息一下', 3400);
    }
    updateEyeUI();
  } else if(eyeTimer.mode === 'need-rest'){
    eyeTimer.overdueMs += dt;
    eyeTimer.nagAccumMs += dt;
    if(eyeTimer.nagAccumMs >= EYE_NAG_MS){
      eyeTimer.nagAccumMs -= EYE_NAG_MS;
      playEyeAlert();
      toast('⚠️ 还没放松眼睛哦，快点「放松眼睛」吧', 2600);
    }
    updateEyeUI();
  } else if(eyeTimer.mode === 'rest'){
    eyeTimer.leftMs -= dt;
    if(eyeTimer.leftMs <= 0){
      const cfg = getEyeCfg();
      eyeTimer.mode = 'use';
      eyeTimer.totalMs = cfg.useMin * 60000;
      eyeTimer.leftMs = eyeTimer.totalMs;
      eyeTimer.overdueMs = 0;
      eyeTimer.nagAccumMs = 0;
      playRestDone();
      toast('✅ 放松结束，继续加油！', 2200);
    }
    updateEyeUI();
  }
}
function moveEyeToken(p){
  if(!eyeTokenEl || !eyeRailEl) return;
  if(eyeRailW < 0) measureEyeRail();
  const x = eyeRailW * clamp(p, 0, 1);
  eyeTokenEl.style.transform = 'translate(' + x.toFixed(2) + 'px, -50%)';
  if(eyeFillEl) eyeFillEl.style.width = (clamp(p, 0, 1) * 100) + '%';
}
function updateEyeUI(){

  if(!eyeTimer.active){
    card.className = 'eye-card idle';
    if(timeEl) timeEl.textContent = '--:--';
    if(btn){ btn.disabled = true; btn.textContent = '😌 放松眼睛'; }
    p = 0;
  } else if(eyeTimer.mode === 'use'){
    card.className = 'eye-card using';
    if(timeEl) timeEl.textContent = fmtMs(eyeTimer.leftMs);
    if(btn){ btn.disabled = false; btn.textContent = '😌 放松眼睛'; }
    p = eyeTimer.totalMs > 0 ? 1 - (eyeTimer.leftMs / eyeTimer.totalMs) : 0;
  } else if(eyeTimer.mode === 'need-rest'){
    card.className = 'eye-card alert';
    if(timeEl) timeEl.textContent = '已等待' + fmtMs(eyeTimer.overdueMs);
    if(btn){ btn.disabled = false; btn.textContent = '😌 开始放松'; }
    p = 1;
  } else if(eyeTimer.mode === 'rest'){
    card.className = 'eye-card resting';
    if(timeEl) timeEl.textContent = fmtMs(eyeTimer.leftMs);
    if(btn){ btn.disabled = true; btn.textContent = '放松中…'; }
    p = eyeTimer.totalMs > 0 ? (eyeTimer.leftMs / eyeTimer.totalMs) : 0;
  }
  moveEyeToken(p);
}

function setDogProgress(p){
  const trackW = trackEl.clientWidth || 300;
  const dogW = dogWrap.offsetWidth || 42;
  const startX = Math.max(0, trackW-dogW-6);
  const endX = 2;
  const t = clamp(p,0,1);
  dogWrap.style.transform = `translateX(${startX+(endX-startX)*t}px)`;
}
function updateDogBar(){
  if(!live.taskId || live.mode === 'idle'){
    trackEl.className='track';
    setDogProgress(0);
    trackFill.className='track-fill'; trackFill.style.width='0%';
    trackTime.className='track-time'; trackTime.textContent='--:--';
    timerHint.innerHTML = '点击右侧「<span class="highlight">▶ 开始</span>」启动倒计时';
    return;
  }
  const info = findTask(live.taskId);
  if(!info){ live.taskId = null; updateDogBar(); return; }
  const name = info.task.text;
  const leftMs = calcLiveLeftMs(live);
  const totalMs = live.totalMs || info.task.minutes*60000;
  const p = totalMs > 0 ? 1 - leftMs/totalMs : 0;
  if(live.mode === 'paused'){
    trackEl.className = 'track paused';
    setDogProgress(p);
    trackFill.className = 'track-fill'; trackFill.style.width = (p*100)+'%';
    trackTime.className = 'track-time paused';
    trackTime.textContent = fmtMs(leftMs);
    timerHint.innerHTML = '⏸ <span class="paused-t">已暂停</span>：' + escapeHtml(name);
    return;
  }
  if(live.mode === 'chomping'){
    trackEl.className = 'track chomping';
    setDogProgress(1);
    trackFill.className = 'track-fill'; trackFill.style.width = '100%';

function tick(now){
  const dt = Math.min(500, now - lastTs);
  lastTs = now;

  if(isMyLive()){
    if(live.mode === 'running'){
      tickChar(dt);
      if(calcLiveLeftMs(live) <= 0){
        live.rounds = (live.rounds || 0) + 1;
        live.mode = 'chomping';
        live.chompingEndAt = Date.now() + CHOMP_HOLD_MS;
        live.leftMs = live.totalMs;
        resetCharProgress();
        eatSun(1, '⏰ 第 <b>'+live.rounds+'</b> 轮结束，任务未完成！<br>扣掉 1 颗金币 💰');
        pushLive(true);
      }
    } else if(live.mode === 'chomping'){
      if(Date.now() >= live.chompingEndAt){
        live.mode = 'running';
        live.startAt = Date.now();
        live.leftMs = live.totalMs;
        dogEl.classList.remove('chomp');
        dogEl.classList.add('running');
        pushLive(true);
      }
    }
  }

  tickEye(dt);
  updateDogBar();
  if(live.taskId) updateCardVisual(live.taskId);
  updateMainBtn();

  const needsTick = (live.mode === 'running' || live.mode === 'chomping') || eyeTimer.active;
  if(needsTick) rafId = requestAnimationFrame(tick);
  else rafId = null;
}
function ensureTickRunning(){ if(!rafId){ lastTs = performance.now(); rafId = requestAnimationFrame(tick); } }
function stopTick(){
  cancelAnimationFrame(rafId); rafId=null;
  dogEl.classList.remove('running','paused','chomp');
  if(eyeTimer.active) ensureTickRunning();
}

function startTask(id){
  const info = findTask(id);
  if(!info || info.task.done) return;
  const taskMs = clamp(Number(info.task.minutes)||10, 0.5, 120) * 60000;
  const isSameTask = (live.taskId === id);
  const hasProgress = isSameTask && live.leftMs > 0 && live.leftMs < taskMs && live.mode !== 'chomping';

  live.taskId = id;
  live.mode = 'running';
  live.totalMs = taskMs;
  if(hasProgress){
    live.startAt = Date.now() - (live.totalMs - live.leftMs);
  } else {
    live.startAt = Date.now();
    live.leftMs = live.totalMs;
    live.rounds = 0;
  }
  live.chompingEndAt = 0;
  live.owner = myClientId;
  pushLive(true);

  dogEl.classList.remove('paused','chomp');
  dogEl.classList.add('running');
  initCharTimer(id);
  setCharPaused(false);
  if(!eyeTimer.active) startEyeCare();
  playSound('start');
  ensureTickRunning();
  refreshAllCards(); updateDogBar(); updateMainBtn();
  scrollToCard(id);
}
function doPause(){
  if(live.mode !== 'running') return;
  live.leftMs = calcLiveLeftMs(live);
  live.mode = 'paused';
  live.owner = myClientId;
  pushLive(true);
  dogEl.classList.remove('running');
  dogEl.classList.add('paused');
  setCharPaused(true);
  playSound('pause');
  refreshAllCards(); updateDogBar(); updateMainBtn();
  toast('⏸ 已暂停，倒计时停留在当前时间', 1800);
}
function resumeLive(){
  if(live.mode !== 'paused') return;
  live.startAt = Date.now() - (live.totalMs - live.leftMs);
  live.mode = 'running';
  live.owner = myClientId;
  pushLive(true);
  dogEl.classList.remove('paused');
  dogEl.classList.add('running');
  setCharPaused(false);
  playSound('start');
  ensureTickRunning();
  refreshAllCards(); updateDogBar(); updateMainBtn();
  toast('▶ 已恢复倒计时', 2000);
}
function onMainBtnClick(){
  if(live.mode === 'paused'){ resumeLive(); return; }
  if(!live.taskId || live.mode === 'idle'){
    const first = allTasks().find(t=>!t.done);
    if(first){ startTask(first.id); }
    return;
  }
  const info = findTask(live.taskId);
  if(!info || info.task.done){
    const next = allTasks().find(t=>!t.done);
    if(next){ startTask(next.id); }
    return;
  }
  if(live.mode === 'running'){ requestPause(); return; }
  startTask(live.taskId);
}

============================================================ */
function compressImage(file, maxSize, quality){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if(width > maxSize || height > maxSize){
          if(width > height){ height = Math.round(height * maxSize / width); width = maxSize; }
          else { width = Math.round(width * maxSize / height); height = maxSize; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality || 0.72));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
let currentPhotoTaskId = null;
function takePhoto(taskId){
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.capture = 'environment';
  input.onchange = async () => {
    const file = input.files && input.files[0];
    if(!file) return;
    try{
      const data = await compressImage(file, 900, 0.75);
      if(!photos[taskId]) photos[taskId] = [];
      photos[taskId].push({ id: 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2,5), data, ts: Date.now() });
      if(photos[taskId].length > 6) photos[taskId] = photos[taskId].slice(-6);
      savePhotos();
      const info = findTask(taskId);
      if(info && !info.task.done){
        completeTask(taskId);
        toast('📷 照片已保存，任务已标记完成', 2400);
      } else {
        renderBoard(); refreshAllCards();
        toast('📷 照片已保存');
      }
    }catch(e){
      console.error(e);
      toast('⚠️ 拍照失败，请重试');
    }
  };
  input.click();
}

  currentPhotoTaskId = taskId;

  const d = new Date(state.date + 'T00:00:00');

function renderCalendar(){
  calTitle.textContent = `${calYear}年${calMonth+1}月`;
  calGrid.innerHTML = '';
  const firstDay = new Date(calYear, calMonth, 1);
  const startWeek = firstDay.getDay();
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  const prevMonthDays = new Date(calYear, calMonth, 0).getDate();
  const today = todayStr();
  for(let i = startWeek - 1; i >= 0; i--){
    const cell = document.createElement('div');
    cell.className = 'cal-day other-month'; cell.textContent = prevMonthDays - i;
    calGrid.appendChild(cell);
  }
  for(let d = 1; d <= daysInMonth; d++){
    const dateStr = `${calYear}-${pad2(calMonth+1)}-${pad2(d)}`;
    const cell = document.createElement('div');
    cell.className = 'cal-day'; cell.textContent = d;
    if(dateStr === today) cell.classList.add('today');
    if(dateStr === state.date) cell.classList.add('selected');
    const day = state.days[dateStr];
    if(day){
      const all = [...(day.chinese||[]), ...(day.math||[]), ...(day.english||[])];
      if(all.length > 0){
        const done = all.filter(t => t.done).length;
        const mark = document.createElement('span');
        mark.className = 'cal-mark' + (done === all.length ? ' done' : '');
        cell.appendChild(mark);
      }
    }
    cell.addEventListener('click', () => { switchDate(dateStr); calModal.classList.remove('show'); });
    calGrid.appendChild(cell);
  }
  const totalCells = startWeek + daysInMonth;
  const remain = (7 - totalCells % 7) % 7;
  for(let i = 1; i <= remain; i++){
    const cell = document.createElement('div');
    cell.className = 'cal-day other-month'; cell.textContent = i;
    calGrid.appendChild(cell);
  }
}

let pdfJsLoading = null;
function loadPdfJs(){
  if(window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if(pdfJsLoading) return pdfJsLoading;
  pdfJsLoading = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js';
    s.onload = () => {
      if(window.pdfjsLib){
        try{ window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js'; }catch(e){}
        resolve(window.pdfjsLib);
      } else reject(new Error('PDF 组件未就绪'));
    };
    s.onerror = () => reject(new Error('PDF 组件加载失败'));
    document.head.appendChild(s);
  });
  return pdfJsLoading;
}
async function extractPdfText(file){
  const lib = await loadPdfJs();
  const buf = await file.arrayBuffer();
  const pdf = await lib.getDocument({ data: new Uint8Array(buf) }).promise;
  let all = '';
  for(let p = 1; p <= pdf.numPages; p++){
    const page = await pdf.getPage(p);
    const content = await page.getTextContent();
    const items = (content.items || []).filter(it => typeof it.str === 'string' && it.str.length);
    items.sort((a, b) => { const ya=a.transform[5],yb=b.transform[5]; if(Math.abs(ya-yb)>3) return yb-ya; return a.transform[4]-b.transform[4]; });
    let lastY = null, lastRight = null;
    for(const it of items){
      const y = it.transform[5], x = it.transform[4];
      if(lastY !== null && Math.abs(y - lastY) > 3){ all += '\n'; lastRight = null; }
      else if(lastRight !== null && (x - lastRight) > 1.5 && !/\s$/.test(all)) all += ' ';
      all += it.str; lastY = y; lastRight = x + (Number(it.width) || 0);
    }
    all += '\n';
  }
  return all;
}
function collectHanzi(src, start){
  let s = '';
  for(let i = start; i < src.length; i++){
    const c = src.charAt(i);
    if(/[\u4e00-\u9fa5]/.test(c)) s += c;
    else if(c === ' ' || c === '\t' || c === '\u3000' || c === '\n') continue;
    else break;
  }
  return s;
}
function collectAllHanzi(src){
  let s = '';
  const str = String(src || '');
  for(let i = 0; i < str.length; i++){ const c = str.charAt(i); if(/[\u4e00-\u9fa5]/.test(c)) s += c; }
  return s;
}
function parseHanziSheet(text){
  const src = String(text || '').replace(/\r/g, '');
  if(!src.trim()) return [];
  const lines = src.split('\n');
  const out = [];
  let section = ''; let cur = null;
  const finish = () => { if(cur && cur.hanzi) out.push({ label: cur.label.slice(0,60), hanzi: cur.hanzi }); cur = null; };
  const SEC_ONLY_RE = /^[#＃\s]*[（(【\[]?\s*(阅读|识字)\s*[)）】\]]?\s*$/;
  const SEC_NUM_RE  = /^[#＃\s]*[（(【\[]?\s*(阅读|识字)\s*(\d{1,2})/;
  const LESSON_RE   = /^[#＃\s]*[（(【\[]?\s*(\d{1,2}|语文园地[一二三四五六七八九十]+)/;
  const TRIM_HEAD   = /^[\s、．.。,:：;；)）】\]\-—_]+/;
  for(let i = 0; i < lines.length; i++){
    const line = lines[i].replace(/\u3000/g, ' ').trim();
    if(!line) continue;
    if(SEC_ONLY_RE.test(line)){ finish(); section = line.match(SEC_ONLY_RE)[1]; continue; }
    let label = null, rest = '';
    const snm = line.match(SEC_NUM_RE); const lm = line.match(LESSON_RE);
    if(snm){ section = snm[1]; label = snm[1] + snm[2]; rest = line.slice(snm[0].length); }
    else if(lm){ label = section + lm[1]; rest = line.slice(lm[0].length); }
    if(label !== null){ finish(); rest = rest.replace(TRIM_HEAD, ''); cur = { label, hanzi: collectHanzi(rest, 0) }; continue; }
    if(cur) cur.hanzi += collectAllHanzi(line);
  }
  finish();
  return out;
}
function mergeSheet(entries, field){
  const grouped = new Map();
  entries.forEach(({ label, hanzi }) => {
    if(!label || !hanzi) return;
    if(!grouped.has(label)) grouped.set(label, []);
    grouped.get(label).push(hanzi);
  });
  let added = 0, updated = 0;
  grouped.forEach((list, label) => {
    const name = label.slice(0, 60);
    const uniq = [...new Set(parseChars(list.join('')))];
    if(!uniq.length) return;
    if(!state.lessonLibrary[name]){ state.lessonLibrary[name] = { chars:'', wordgroups:'', words:'' }; added++; }
    else updated++;
    const item = state.lessonLibrary[name];
    const oldList = (field === 'chars') ? parseChars(item.chars) : parseChars(item.wordgroups);
    const merged = [...oldList];
    uniq.forEach(c => { if(!merged.includes(c)) merged.push(c); });
    item[field] = merged.join(' ');
  });
  return { added, updated };
}

function lessonPickItems(kind){
  const cfg = LESSON_PICK[kind];
  const sel = $(cfg.sel);
  const name = sel ? sel.value : '';
  if(!name) return { name:'', items:[] };
  const item = (state.lessonLibrary || {})[name] || {};
  const raw = String(item[cfg.field] || '');
  const items = (kind === 'preview') ? [...new Set(parseChars(raw))] : parseWords(raw);
  return { name, items };
}
function renderLessonHint(kind){
  const cfg = LESSON_PICK[kind];
  const hint = $(cfg.hint);
  if(!hint) return;
  const { name, items } = lessonPickItems(kind);
  if(!name){ hint.className = 'aa-hint'; hint.textContent = '选好课文直接点「添加」即可，不用手动输入'; return; }
  if(!items.length){ hint.className = 'aa-hint warn'; hint.textContent = '「' + name + '」还没有' + cfg.label + '内容，请到下面「课文库」里补充'; return; }
  const shown = items.slice(0, 24).join(' ');
  hint.className = 'aa-hint ok';
  hint.textContent = '将添加 ' + items.length + ' ' + cfg.unit + '：' + shown + (items.length > 24 ? ' …' : '');
}
