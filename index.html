<script type="module">

/* ============================================================
   【新增 1】组词词库 规范化
============================================================ */
function normalizeWordBank(raw){
  const out = {};
  if(!raw || typeof raw !== 'object') return out;
  Object.keys(raw).forEach(k => {
    const ch = String(k).slice(0, 4);
    if(!ch || !/[\u4e00-\u9fa5]/.test(ch)) return;
    const arr = Array.isArray(raw[k]) ? raw[k] : [];
    const list = arr
      .map(w => String(w).trim())
      .filter(w => /^[\u4e00-\u9fa5]{1,8}$/.test(w) && w.indexOf(ch) >= 0);
    const uniq = [...new Set(list)].slice(0, 12);
    if(uniq.length) out[ch] = uniq;
  });
  return out;
}

/* ============================================================
   【新增 2】休息日自动同步
============================================================ */
/* 国定假日（YYYY-MM-DD）——按需补充，周末自动识别 */
const REST_HOLIDAYS = new Set([
  // '2026-10-01','2026-10-02','2026-10-03',
  // '2026-05-01','2026-06-19',
]);

function isRestDay(dateStr){
  if(REST_HOLIDAYS.has(dateStr)) return true;
  const d = new Date(dateStr + 'T00:00:00');
  const w = d.getDay();
  return w === 0 || w === 6;
}
function dayHasTasks(dateStr){
  const d = state.days[dateStr];
  if(!d) return false;
  return ['chinese','math','english'].some(k => (d[k] || []).length > 0);
}
function cloneTaskForNewDay(t){
  const nt = JSON.parse(JSON.stringify(t));
  nt.id = newId();
  nt.done = false;
  delete nt.photos;
  delete nt.checkedChars;
  return nt;
}
function syncFromPreviousDay(targetDate, opts){
  opts = opts || {};
  if(!state.days[targetDate]) state.days[targetDate] = makeDay();
  if(!opts.force && dayHasTasks(targetDate)) return { ok:false, reason:'has-tasks' };

  let srcDate = null;
  const d = new Date(targetDate + 'T00:00:00');
  for(let i = 1; i <= 7; i++){
    d.setDate(d.getDate() - 1);
    const ds = fmtDate(d);
    if(dayHasTasks(ds)){ srcDate = ds; break; }
  }
  if(!srcDate) return { ok:false, reason:'no-source' };

  const src = state.days[srcDate];
  const out = makeDay();
  let count = 0;
  ['chinese','math','english'].forEach(k => {
    out[k] = (src[k] || []).map(t => { count++; return cloneTaskForNewDay(t); });
  });
  state.days[targetDate] = out;
  saveLocalState(); uploadToCloud();

  if(state.date === targetDate){
    renderBoard(); refreshAllCards(); updateDogBar(); updateMainBtn();
  }
  if(isAdminMode) renderAdminPanel();
  return { ok:true, srcDate, count };
}
function autoSyncRestDay(dateStr){
  if(!dateStr) return false;
  if(!isRestDay(dateStr)) return false;
  if(dayHasTasks(dateStr)) return false;
  const r = syncFromPreviousDay(dateStr, {});
  return !!r.ok;
}

/* ============================================================
   【新增 3】剩余字数 → 收紧总倒计时
============================================================ */
function countRemainingUnits(taskId){
  const ref = cardRefs[taskId];
  const info = findTask(taskId);
  if(!ref || !ref.el || !info) return null;
  const type = info.task.type;
  if(type !== 'preview' && type !== 'wordgroup' && type !== 'copy') return null;
  const grid = ref.el.querySelector('.char-grid');
  if(!grid) return null;

  let total = 0, remaining = 0;
  if(type === 'preview'){
    grid.querySelectorAll('.char-card').forEach(card => {
      const m = card.querySelector('.mizi');
      if(!m) return;
      total++;
      if(!m.classList.contains('checked')) remaining++;
    });
  } else {
    grid.querySelectorAll('.word-group').forEach(g => {
      const mizis = g.querySelectorAll('.mizi');
      if(!mizis.length) return;
      total++;
      let allDone = true;
      mizis.forEach(m => { if(!m.classList.contains('checked')) allDone = false; });
      if(!allDone) remaining++;
    });
  }
  return { total, remaining };
}

/* 打勾后：总倒计时 = min(当前总倒计时, 剩余数量 × 单位分钟) */
function applyCheckedDurationCap(taskId){
  const info = findTask(taskId);
  if(!info) return;
  const task = info.task;
  if(task.type !== 'preview' && task.type !== 'wordgroup' && task.type !== 'copy') return;

  const counts = countRemainingUnits(taskId);
  if(!counts || counts.remaining <= 0) return;

  const cfg = getUnitCfg(task.type);
  const newTotalMs = Math.round(counts.remaining * cfg.min * 60000);
  if(newTotalMs <= 0) return;

  const L = state.live;
  if(L && L.activeId === taskId){
    if(L.overdue || L.status === 'timeup') return;      // 超时中不调整
    if(L.totalMs <= newTotalMs) return;                 // 总时长已经更短 → 不变

    const left = liveLeftMs(L);
    const newLeft = Math.min(left, newTotalMs);
    L.totalMs = newTotalMs;
    L.unitMs = cfg.min * 60000;
    L.leftAtStart = newLeft;
    L.startedAt = Date.now();
    pushLive();
    refreshAllCards();
    updateDogBar();
  } else {
    const rt = runtimeMap[taskId];
    if(rt && rt.totalMs > newTotalMs){
      rt.totalMs = newTotalMs;
      if(rt.leftMs > newTotalMs) rt.leftMs = newTotalMs;
      updateCardVisual(taskId);
    }
  }
  paintCharBarsFromLive();
}

/* ============================================================
   【新增 4】笔顺弹窗里的语音组词
============================================================ */
let voiceRec = null;
let voiceListening = false;

function renderWordMizi(word){
  const chars = [...word].filter(c => /[\u4e00-\u9fa5]/.test(c));
  return '<div class="word-group">' + chars.map(c =>
    '<div class="wg-item">' +
      '<div class="char-pinyin">' + (getPinyin(c) || '&nbsp;') + '</div>' +
      '<div class="mizi">' + miziSvg() + '<span class="mizi-char">' + escapeHtml(c) + '</span></div>' +
    '</div>'
  ).join('') + '</div>';
}

function renderStrokeWords(char){
  const box = $('strokeWords');
  if(!box) return;
  const list = (state.wordBank && state.wordBank[char]) ? state.wordBank[char] : [];
  if(!list.length){
    box.innerHTML = '<div class="sw-empty">还没有组词，点「🎤 语音组词」试试</div>';
    return;
  }
  box.innerHTML = list.map((w, i) =>
    '<div class="sw-item" data-sw-i="' + i + '">' +
      renderWordMizi(w) +
      '<button class="sw-del" data-sw-del="' + i + '" title="删除">✕</button>' +
    '</div>'
  ).join('');
  box.querySelectorAll('[data-sw-del]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      removeCharWord(char, Number(btn.dataset.swDel));
    });
  });
}

function addCharWord(char, word){
  const w = String(word || '').trim();
  if(!w) return false;
  if(w.indexOf(char) < 0){ toast('词语里要包含「' + escapeHtml(char) + '」哦'); return false; }
  if(!/^[\u4e00-\u9fa5]{1,8}$/.test(w)){ toast('请输入 1-8 个汉字'); return false; }
  if(!state.wordBank) state.wordBank = {};
  if(!Array.isArray(state.wordBank[char])) state.wordBank[char] = [];
  const arr = state.wordBank[char];
  if(arr.indexOf(w) >= 0){ toast('已经记录过「' + escapeHtml(w) + '」了'); return false; }
  if(arr.length >= 12){ toast('每个字最多记 12 个词'); return false; }
  arr.push(w);
  saveLocalState(); uploadToCloud();
  renderStrokeWords(char);
  toast('✅ 已添加词语：' + escapeHtml(w));
  return true;
}
function removeCharWord(char, index){
  const arr = state.wordBank && state.wordBank[char];
  if(!Array.isArray(arr)) return;
  arr.splice(index, 1);
  if(!arr.length) delete state.wordBank[char];
  saveLocalState(); uploadToCloud();
  renderStrokeWords(char);
}

function extractWordCandidates(text, ch){
  const out = [];
  const push = w => {
    w = String(w || '').trim();
    if(!w) return;
    if(w.indexOf(ch) < 0) return;
    if(!/^[\u4e00-\u9fa5]+$/.test(w)) return;
    if(w.length > 6) return;
    if(out.indexOf(w) >= 0) return;
    out.push(w);
  };
  const clean = String(text || '').replace(/[^\u4e00-\u9fa5]/g, ' ');
  clean.split(/\s+/).filter(Boolean).forEach(seg => {
    if(seg.indexOf(ch) < 0) return;
    if(seg.length <= 3) push(seg);
    for(let i = 0; i + 2 <= seg.length; i++) push(seg.slice(i, i + 2));
    if(seg.length >= 3 && seg.length <= 6) push(seg);
  });
  return out.slice(0, 12);
}

function resetVoiceUI(){
  const btn = $('strokeVoiceBtn');
  const status = $('strokeVoiceStatus');
  const cands = $('strokeVoiceCands');
  if(cands) cands.innerHTML = '';
  if(status){ status.textContent = ''; status.className = 'voice-status'; }
  if(btn){
    btn.classList.remove('listening');
    btn.textContent = '🎤 语音组词';
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    btn.disabled = !SR;
    if(!SR && status){ status.textContent = '当前浏览器不支持语音识别，可手动输入'; }
  }
  voiceListening = false;
  const input = $('strokeVoiceInput');
  if(input) input.value = '';
}

function startVoice(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const btn = $('strokeVoiceBtn');
  const status = $('strokeVoiceStatus');
  const cands = $('strokeVoiceCands');
  if(!SR){
    if(status){ status.className = 'voice-status err'; status.textContent = '当前浏览器不支持语音识别，请手动输入'; }
    return;
  }
  if(voiceListening && voiceRec){ try{ voiceRec.stop(); }catch(e){} return; }

  try{
    voiceRec = new SR();
    voiceRec.lang = 'zh-CN';
    voiceRec.interimResults = false;
    voiceRec.maxAlternatives = 5;
    voiceRec.continuous = false;
  }catch(e){
    if(status){ status.className = 'voice-status err'; status.textContent = '语音识别初始化失败'; }
    return;
  }
  voiceListening = true;
  if(btn){ btn.classList.add('listening'); btn.textContent = '⏹ 正在听…'; }
  if(status){ status.className = 'voice-status'; status.textContent = '请说出包含「' + lastStrokeChar + '」的词语…'; }
  if(cands) cands.innerHTML = '';

  voiceRec.onresult = ev => {
    const texts = [];
    for(let i = 0; i < ev.results.length; i++){
      for(let j = 0; j < ev.results[i].length; j++) texts.push(ev.results[i][j].transcript || '');
    }
    handleVoiceText(texts.join(' '));
  };
  voiceRec.onerror = ev => {
    if(status){
      status.className = 'voice-status err';
      status.textContent = ev.error === 'not-allowed'
        ? '麦克风未授权，请在浏览器设置里允许'
        : ('识别失败：' + ev.error);
    }
  };
  voiceRec.onend = () => {
    voiceListening = false;
    if(btn){ btn.classList.remove('listening'); btn.textContent = '🎤 语音组词'; }
  };
  try{ voiceRec.start(); }
  catch(e){
    voiceListening = false;
    if(btn){ btn.classList.remove('listening'); btn.textContent = '🎤 语音组词'; }
    if(status){ status.className = 'voice-status err'; status.textContent = '无法启动语音识别'; }
  }
}

function handleVoiceText(text){
  const ch = lastStrokeChar;
  const status = $('strokeVoiceStatus');
  const cands = $('strokeVoiceCands');
  const list = extractWordCandidates(text, ch);
  if(!list.length){
    if(status){ status.className = 'voice-status err'; status.textContent = '没听清包含「' + ch + '」的词语，再试一次吧'; }
    if(cands) cands.innerHTML = '';
    return;
  }
  if(status){ status.className = 'voice-status ok'; status.textContent = '识别到这些词语，点一下添加：'; }
  if(cands){
    cands.innerHTML = list.map(w =>
      '<button class="voice-cand" type="button" data-vc="' + escapeAttr(w) + '">' + escapeHtml(w) + '</button>'
    ).join('');
    cands.querySelectorAll('[data-vc]').forEach(b => {
      b.addEventListener('click', () => {
        if(addCharWord(ch, b.dataset.vc)) b.disabled = true;
      });
    });
  }
}

  if(!s.wordBank || typeof s.wordBank !== 'object') s.wordBank = {};
  else s.wordBank = normalizeWordBank(s.wordBank);

/* ============================================================
   【修改 5】liveStartTask —— 开始任务时也按剩余数量收紧
   （把 `const totalMs = clamp(...)` 那一行替换为下面两行）
============================================================ */
function computeStartTotalMs(task, taskId){
  const base = clamp(Number(task.minutes) || 10, 0.5, 120) * 60000;
  if(task.type !== 'preview' && task.type !== 'wordgroup' && task.type !== 'copy') return base;
  const counts = countRemainingUnits(taskId);
  if(!counts || counts.remaining <= 0 || counts.remaining >= counts.total) return base;
  const cfg = getUnitCfg(task.type);
  const ms = Math.round(counts.remaining * cfg.min * 60000);
  if(ms <= 0) return base;
  return Math.min(base, ms);
}

function bindSyncPrevButtons(){
  const calBtn = $('calSyncPrevBtn');
  if(calBtn){
    calBtn.addEventListener('click', () => {
      const r = syncFromPreviousDay(state.date, { force: true });
      if(r.ok){
        calModal.classList.remove('show');
        toast('✅ 已从 ' + r.srcDate + ' 同步 ' + r.count + ' 项作业');
      } else if(r.reason === 'no-source'){
        toast('⚠️ 往前 7 天都没有作业可同步');
      } else {
        toast('⚠️ 同步失败');
      }
    });
  }
  const adminBtn = $('adminSyncPrevBtn');
  if(adminBtn){
    adminBtn.addEventListener('click', () => {
      const r = syncFromPreviousDay(state.date, { force: true });
      if(r.ok) toast('✅ 已从 ' + r.srcDate + ' 同步 ' + r.count + ' 项作业');
      else if(r.reason === 'no-source') toast('⚠️ 往前 7 天都没有作业可同步');
      else toast('⚠️ 同步失败');
    });
  }
}

(function bindStrokeVoice(){
  const btn = $('strokeVoiceBtn');
  const addBtn = $('strokeVoiceAddBtn');
  const input = $('strokeVoiceInput');
  if(btn) btn.addEventListener('click', startVoice);
  if(addBtn) addBtn.addEventListener('click', () => {
    const v = (input && input.value || '').trim();
    if(!v){ toast('请输入词语'); return; }
    if(addCharWord(lastStrokeChar, v) && input) input.value = '';
  });
  if(input) input.addEventListener('keydown', e => {
    if(e.key === 'Enter'){ e.preventDefault(); if(addBtn) addBtn.click(); }
  });
})();
